services:
  mysql:
    image: mysql:8.0
    container_name: gaslachispa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gaslachispa
      MYSQL_USER: gasla
      MYSQL_PASSWORD: gasla123
    ports:
      - "3307:3306"
    volumes:
      - gaslachispa_mysql_data:/var/lib/mysql

volumes:
  gaslachispa_mysql_data:
