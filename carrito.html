<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas La Chispa - Mi Carrito</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu hoja de estilos externa -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand text-warning fw-bold" href="index.html">🔥 Gas La Chispa</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a href="login.html" class="nav-link">Iniciar sesión</a></li> 
                        <!--funcion a remplazar -->
                        <li class="nav-item"><a class="nav-link" href="index.html">Productos</a></li>
                        
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item">
                            <a class="nav-link text-warning fw-bold active" href="carrito.html">
                                 Cart (<span id="cart-count">0</span>)
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL DEL CARRITO -->
    <main class="container my-5">
        <h2 class="fw-bold mb-4">Mi carrito de compras</h2>
        
        <div class="row">
            <!-- Columna Izquierda: Lista de Productos -->
            <div class="col-md-8" id="lista-carrito">
                <!-- Se llenará con JavaScript -->
                <div class="alert alert-info">Cargando productos...</div>
            </div>
            
            <!-- Columna Derecha: Resumen de Pago -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-light">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                            <h4 class="fw-bold mb-0">TOTAL:</h4>
                            <h4 id="total-carrito" class="text-success fw-bold mb-0">$ 0</h4>
                        </div>
                        
                        <div class="input-group mb-4">
                            <input type="text" class="form-control" placeholder="Cupón de descuento">
                            <button class="btn btn-outline-secondary" type="button">APLICAR</button>
                        </div>
                        
                        <button class="btn btn-warning w-100 fw-bold btn-lg">PAGAR AHORA</button>
                        <p class="text-center text-muted small mt-3 mb-0">Pago seguro garantizado</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <h4 class="text-warning">Gas La Chispa</h4>
                    <p class="small">Distribución rápida y segura.</p>
                </div>
                <div class="col-md-4 mb-3">
                    <a href="#" class="text-white text-decoration-none d-block">Términos y condiciones</a> 
                </div>
                <div class="col-md-4">
                    <p class="mb-2">Mantente en contacto</p>
                    <form action="#" method="POST" id="newsletter-form" class="d-flex justify-content-center">
                        <input type="email" class="form-control w-50 me-2" placeholder="Ingresa tu correo" required>
                        <button type="submit" class="btn btn-warning">Suscribirse</button>
                    </form>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JS externo -->
    <script src="js/main.js"></script>

    <!-- Lógica de pintado de la vista Carrito -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const listaCarrito = document.getElementById("lista-carrito");
            const totalCarrito = document.getElementById("total-carrito");
            
            // Cargar carrito desde LocalStorage
            let carritoActual = JSON.parse(localStorage.getItem("carritoLaChispa")) || [];

            function renderizarCarrito() {
                listaCarrito.innerHTML = "";
                let total = 0;

                if (carritoActual.length === 0) {
                    listaCarrito.innerHTML = `
                        <div class="alert alert-warning text-center">
                            Tu carrito está vacío. <br> <a href="productos.html" class="btn btn-sm btn-dark mt-2">Volver a la tienda</a>
                        </div>
                    `;
                    totalCarrito.textContent = "$ 0";
                    return;
                } 

                carritoActual.forEach(item => {
                    const subtotal = item.precio * item.cantidad;
                    total += subtotal;
                    
                    listaCarrito.innerHTML += `
                        <div class="card mb-3 shadow-sm border-0">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-3 col-md-2 text-center">
                                        <img src="${item.img}" class="img-fluid rounded border" alt="${item.nombre}" style="max-height: 80px; object-fit: contain;">
                                    </div>
                                    <div class="col-5 col-md-4">
                                        <h5 class="card-title fw-bold mb-1">${item.nombre}</h5>
                                        <small class="text-muted d-block">${item.desc}</small>
                                    </div>
                                    <div class="col-4 col-md-3 text-end fs-5 text-success fw-bold">
                                        $ ${item.precio.toLocaleString('es-CL')}
                                    </div>
                                    <div class="col-12 col-md-3 mt-3 mt-md-0">
                                        <div class="input-group input-group-sm justify-content-end">
                                            <button class="btn btn-outline-secondary" type="button" onclick="modificarCantidad('${item.id}', -1)">-</button>
                                            <input type="text" class="form-control text-center" style="max-width: 50px;" value="${item.cantidad}" readonly>
                                            <button class="btn btn-outline-secondary" type="button" onclick="modificarCantidad('${item.id}', 1)">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                totalCarrito.textContent = `$ ${total.toLocaleString('es-CL')}`;
            }

            // Función global para que los botones interactúen
            window.modificarCantidad = function(id, modificador) {
                const index = carritoActual.findIndex(p => p.id === id);
                if (index !== -1) {
                    carritoActual[index].cantidad += modificador;
                    
                    if (carritoActual[index].cantidad <= 0) {
                        carritoActual.splice(index, 1); 
                    }
                    
                    localStorage.setItem("carritoLaChispa", JSON.stringify(carritoActual));
                    renderizarCarrito();
                    
                    // Actualiza el span en el header
                    const countElement = document.getElementById("cart-count");
                    if (countElement) {
                        const totalItems = carritoActual.reduce((acc, item) => acc + item.cantidad, 0);
                        countElement.textContent = totalItems;
                    }
                }
            };

            renderizarCarrito();
        });
    </script>
</body>
</html>
